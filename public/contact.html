<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>העסק שלי — צור קשר</title>
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Cloudflare Turnstile — replace data-sitekey with your key from dash.cloudflare.com/turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="https://browser.sentry-cdn.com/8.44.0/bundle.min.js" crossorigin="anonymous"></script>
  <script>
    const _sentryDsn = '';
    if (_sentryDsn) Sentry.init({ dsn: _sentryDsn, tracesSampleRate: 0.2 });
  </script>
</head>
<body>

<nav style="display:flex;align-items:center;gap:1rem;">
  <img src="/images/logo.png" alt="לוגו" style="height:50px;width:auto;">
  <span class="logo">העסק שלי</span>
  <ul style="margin-left:auto;">
    <li><a href="/index.html">בית</a></li>
    <li><a href="/about.html">אודות</a></li>
    <li><a href="/services.html">שירותים</a></li>
    <li><a href="/contact.html" class="active">צור קשר</a></li>
  </ul>
</nav>

<div class="container">
  <section>
    <div style="margin-bottom:3rem;">
      <img src="/images/pic2.png" alt="צור קשר" style="width:100%;max-width:800px;height:auto;border-radius:8px;margin:0 auto;display:block;">
    </div>
  </section>

  <section style="max-width:600px;">
    <h2>צור קשר</h2>
    <p class="lead">מלאו את הטופס ונחזור אליכם תוך יום עסקים אחד.</p>
    <br />

    <div id="alert" class="alert hidden"></div>

    <form id="contactForm">
      <div class="form-row">
        <div class="form-group">
          <label for="name">שם מלא *</label>
          <input type="text" id="name" placeholder="ישראל ישראלי" required />
        </div>
        <div class="form-group">
          <label for="phone">טלפון</label>
          <input type="tel" id="phone" placeholder="050-000-0000" />
        </div>
      </div>
      <div class="form-group">
        <label for="email">דואר אלקטרוני</label>
        <input type="email" id="email" placeholder="israel@example.com" />
      </div>
      <div class="form-group">
        <label for="message">הודעה</label>
        <textarea id="message" placeholder="איך נוכל לעזור לך?"></textarea>
      </div>
      <div class="cf-turnstile" data-sitekey="YOUR_TURNSTILE_SITE_KEY" dir="ltr" style="margin-bottom:1rem;"></div>
      <button type="submit" class="btn btn-primary" id="submitBtn">שלח הודעה</button>
    </form>
  </section>
</div>

<footer>
  &copy; 2025 העסק שלי. כל הזכויות שמורות.
</footer>

<script src="/js/contact.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
