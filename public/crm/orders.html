<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM — הזמנות</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://browser.sentry-cdn.com/8.44.0/bundle.min.js" crossorigin="anonymous"></script>
  <script>
    const _sentryDsn = '';
    if (_sentryDsn) Sentry.init({ dsn: _sentryDsn, tracesSampleRate: 0.2 });
  </script>
</head>
<body>

<a href="#main-content" class="skip-link">דלג לתוכן הראשי</a>

<nav aria-label="ניווט ראשי">
  <span class="logo">CRM העסק שלי</span>
  <ul>
    <li><a href="/" target="_blank">אתר הבית ↗</a></li>
    <li><a href="#" id="logoutBtn">יציאה</a></li>
  </ul>
</nav>

<div class="crm-layout">
  <aside class="sidebar" aria-label="ניווט CRM">
    <a href="/crm/customers.html">לקוחות</a>
    <a href="/crm/orders.html" class="active" aria-current="page">הזמנות</a>
  </aside>

  <main class="crm-main" id="main-content" tabindex="-1">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
      <h2 style="font-size:1.5rem;">הזמנות</h2>
      <div style="display:flex;gap:0.5rem;">
        <button class="btn btn-outline btn-sm" id="downloadBtn" title="הורד כ-CSV">📥 הורד</button>
        <button class="btn btn-primary btn-sm" id="addBtn">+ הזמנה חדשה</button>
      </div>
    </div>

    <div class="toolbar" role="search" aria-label="סינון הזמנות">
      <label for="statusFilter" class="visually-hidden">סינון לפי סטטוס</label>
      <select id="statusFilter" aria-label="סינון לפי סטטוס">
        <option value="">כל הסטטוסים</option>
        <option value="pending">ממתין</option>
        <option value="processing">בעיבוד</option>
        <option value="shipped">נשלח</option>
        <option value="delivered">נמסר</option>
      </select>
      <input type="date" id="fromDate" aria-label="מתאריך" title="מתאריך" />
      <input type="date" id="toDate"   aria-label="עד תאריך" title="עד תאריך" />
    </div>

    <div id="alert" class="alert hidden" role="alert" aria-live="polite"></div>

    <div class="card">
      <div class="table-wrap" style="overflow-x: auto;">
        <table aria-label="רשימת הזמנות" style="min-width: 1000px;">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">לקוח</th>
              <th scope="col">סטטוס</th>
              <th scope="col">סכום</th>
              <th scope="col">חלקי סכום</th>
              <th scope="col">תהליך</th>
              <th scope="col">הערות</th>
              <th scope="col">תאריך</th>
              <th scope="col"><span class="visually-hidden">פעולות</span></th>
            </tr>
          </thead>
          <tbody id="ordersTbody">
            <tr><td colspan="9" style="text-align:center;color:var(--muted)">טוען...</td></tr>
          </tbody>
        </table>
      </div>
      <nav class="pagination" aria-label="עימוד הזמנות">
        <span id="pageInfo" aria-live="polite"></span>
        <button id="prevBtn" disabled aria-label="עמוד קודם">קודם →</button>
        <button id="nextBtn" disabled aria-label="עמוד הבא">← הבא</button>
      </nav>
    </div>
  </main>
</div>

<!-- מודל הזמנה חדשה/עריכה -->
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;">
  <div class="card" style="width:100%;max-width:480px;margin:1rem;">
    <h3 id="modalTitle" style="margin-bottom:1rem;">הזמנה חדשה</h3>
    <form id="orderForm">
      <input type="hidden" id="orderId" />
      <div id="modalAlert" class="alert hidden" role="alert" aria-live="assertive"></div>
      <div class="form-group">
        <label for="oCustomerId">לקוח</label>
        <select id="oCustomerId" required aria-required="true">
          <option value="">בחר לקוח...</option>
        </select>
      </div>
      <div class="form-group">
        <label for="oStatus">סטטוס</label>
        <select id="oStatus">
          <option value="pending">ממתין</option>
          <option value="processing">בעיבוד</option>
          <option value="shipped">נשלח</option>
          <option value="delivered">נמסר</option>
        </select>
      </div>
      <div class="form-group">
        <label for="oTotal">סכום (₪)</label>
        <input type="number" id="oTotal" min="0" step="0.01" placeholder="0.00" />
      </div>
      <div class="form-group">
        <label for="oParts">חלקי סכום</label>
        <input type="text" id="oParts" placeholder="לדוגמה: 500₪ עבודה, 200₪ חומרים" />
      </div>
      <div class="form-group">
        <label for="oProcedure">תהליך</label>
        <input type="text" id="oProcedure" placeholder="לדוגמה: בחיתוך, בהרכבה, בדיקה" />
      </div>
      <div class="form-group">
        <label for="oNotes">הערות</label>
        <textarea id="oNotes" style="resize:vertical;min-height:60px;"></textarea>
      </div>
      <div style="display:flex;gap:.75rem;justify-content:flex-end;">
        <button type="button" class="btn btn-outline" id="cancelBtn">ביטול</button>
        <button type="submit" class="btn btn-primary">שמור</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { requireAuth, apiFetch, logout } from '/js/crm/auth.js';
  requireAuth();

  document.getElementById('logoutBtn').addEventListener('click', (e) => { e.preventDefault(); logout(); });

  const tbody    = document.getElementById('ordersTbody');
  const prevBtn  = document.getElementById('prevBtn');
  const nextBtn  = document.getElementById('nextBtn');
  const pageInfo = document.getElementById('pageInfo');
  const alertEl  = document.getElementById('alert');
  const modal    = document.getElementById('modal');
  const form     = document.getElementById('orderForm');

  const statusHe = { pending: 'ממתין', processing: 'בעיבוד', shipped: 'נשלח', delivered: 'נמסר' };

  let page = 1;
  const LIMIT = 15;

  function buildQuery() {
    const status = document.getElementById('statusFilter').value;
    const from   = document.getElementById('fromDate').value;
    const to     = document.getElementById('toDate').value;
    const params = new URLSearchParams({ page, limit: LIMIT });
    if (status) params.set('status', status);
    if (from)   params.set('from', from);
    if (to)     params.set('to', to);
    return params.toString();
  }

  async function loadOrders() {
    try {
      const res  = await apiFetch(`/api/orders?${buildQuery()}`);
      if (!res) return; // redirected to login (401)
      const data = await res.json();

      if (!res.ok) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;color:var(--danger)">שגיאה: ${esc(data.message || res.status)}</td></tr>`;
        return;
      }

      tbody.innerHTML = data.orders.length === 0
        ? `<tr><td colspan="9" style="text-align:center;color:var(--muted)">לא נמצאו הזמנות.</td></tr>`
        : data.orders.map(o => `
            <tr>
              <td>#${o.id}</td>
              <td><a href="/crm/customer-detail.html?id=${o.customer_id}">${esc(o.customer_name)}</a></td>
              <td><span class="badge badge-${o.status}">${statusHe[o.status] || o.status}</span></td>
              <td>₪${Number(o.total || 0).toFixed(2)}</td>
              <td>${esc(o.parts || '—')}</td>
              <td>${esc(o.procedure || '—')}</td>
              <td>${esc(o.notes || '—')}</td>
              <td>${new Date(o.created_at).toLocaleDateString('he-IL')}</td>
              <td>
                <button class="btn btn-outline btn-sm"
                  onclick="editOrder(${o.id}, '${o.status}', ${o.total || 0}, ${o.customer_id}, '${esc(o.parts || '')}', '${esc(o.procedure || '')}', '${esc(o.notes || '')}')"
                  aria-label="ערוך הזמנה #${o.id}">ערוך</button>
              </td>
            </tr>`).join('');

      const total = data.total;
      pageInfo.textContent = total > 0
        ? `${Math.min((page-1)*LIMIT+1, total)}–${Math.min(page*LIMIT, total)} מתוך ${total}`
        : '';
      prevBtn.disabled = page === 1;
      nextBtn.disabled = page * LIMIT >= total;
      prevBtn.setAttribute('aria-disabled', prevBtn.disabled);
      nextBtn.setAttribute('aria-disabled', nextBtn.disabled);
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;color:var(--danger)">שגיאת טעינה: ${esc(String(err))}</td></tr>`;
    }
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  ['statusFilter','fromDate','toDate'].forEach(id =>
    document.getElementById(id).addEventListener('change', () => { page = 1; loadOrders(); })
  );

  prevBtn.addEventListener('click', () => { page--; loadOrders(); });
  nextBtn.addEventListener('click', () => { page++; loadOrders(); });

  let _returnFocus = null;

  function openModal(opener) {
    _returnFocus = opener || document.activeElement;
    modal.style.display = 'flex';
    setTimeout(() => document.getElementById('oCustomerId').focus(), 50);
  }

  function closeModal() {
    modal.style.display = 'none';
    alertEl.className = 'alert hidden';
    document.getElementById('modalAlert').className = 'alert hidden';
    if (_returnFocus) _returnFocus.focus();
  }

  async function loadCustomersIntoSelect(selectedId) {
    const res = await apiFetch('/api/customers?limit=200');
    const data = await res.json();
    const select = document.getElementById('oCustomerId');
    select.innerHTML = '<option value="">בחר לקוח...</option>' +
      data.customers.map(c => `<option value="${c.id}"${c.id == selectedId ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.style.display === 'flex') closeModal();
  });

  document.getElementById('addBtn').addEventListener('click', async (e) => {
    document.getElementById('modalTitle').textContent = 'הזמנה חדשה';
    form.reset();
    document.getElementById('orderId').value = '';
    await loadCustomersIntoSelect(null);
    openModal(e.currentTarget);
  });
  document.getElementById('cancelBtn').addEventListener('click', closeModal);

  document.getElementById('downloadBtn').addEventListener('click', async () => {
    try {
      const res = await apiFetch('/api/export/orders');
      if (res.ok) {
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'orders.csv';
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
      }
    } catch (err) {
      alertEl.textContent = 'שגיאה בהורדה: ' + err.message;
      alertEl.className = 'alert alert-error';
    }
  });

  window.editOrder = async (id, status, total, customerId, parts, procedure, notes) => {
    document.getElementById('modalTitle').textContent = 'ערוך הזמנה';
    document.getElementById('orderId').value  = id;
    document.getElementById('oStatus').value  = status;
    document.getElementById('oTotal').value   = total;
    document.getElementById('oParts').value   = parts || '';
    document.getElementById('oProcedure').value = procedure || '';
    document.getElementById('oNotes').value   = notes || '';
    await loadCustomersIntoSelect(customerId);
    document.getElementById('oCustomerId').value = customerId;
    openModal(document.querySelector(`[aria-label="ערוך הזמנה #${id}"]`));
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const modalAlert = document.getElementById('modalAlert');
    modalAlert.className = 'alert hidden';
    const id   = document.getElementById('orderId').value;
    const customerId = parseInt(document.getElementById('oCustomerId').value);
    if (!customerId) {
      modalAlert.textContent = 'יש לבחור לקוח';
      modalAlert.className = 'alert alert-error';
      return;
    }
    const body = {
      customer_id: customerId,
      status:      document.getElementById('oStatus').value,
      total:       parseFloat(document.getElementById('oTotal').value) || 0,
      parts:       document.getElementById('oParts').value,
      procedure:   document.getElementById('oProcedure').value,
      notes:       document.getElementById('oNotes').value,
    };
    const method = id ? 'PUT' : 'POST';
    const url    = id ? `/api/orders/${id}` : '/api/orders';
    try {
      const res  = await apiFetch(url, { method, body: JSON.stringify(body) });
      if (res.ok) {
        closeModal();
        loadOrders();
      } else {
        const data = await res.json();
        modalAlert.textContent = data.message || 'שגיאה בשמירה';
        modalAlert.className = 'alert alert-error';
      }
    } catch {
      modalAlert.textContent = 'שגיאת רשת, נסה שוב';
      modalAlert.className = 'alert alert-error';
    }
  });

  loadOrders();
</script>
</body>
</html>
