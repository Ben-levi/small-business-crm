<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM — Login</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://browser.sentry-cdn.com/8.44.0/bundle.min.js" crossorigin="anonymous"></script>
  <script>
    const _sentryDsn = '';
    if (_sentryDsn) Sentry.init({ dsn: _sentryDsn, tracesSampleRate: 0.2 });
  </script>
</head>
<body>

<div class="login-wrap">
  <div class="login-box">
    <h2>CRM Login</h2>
    <div id="alert" class="alert hidden" role="alert" aria-live="assertive"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@example.com" required aria-required="true" autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required aria-required="true" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
    </form>
  </div>
</div>

<script>
  // Redirect if already logged in
  if (localStorage.getItem('crm_token')) {
    window.location.href = '/crm/customers.html';
  }

  const form = document.getElementById('loginForm');
  const alertEl = document.getElementById('alert');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.disabled = true;
    btn.textContent = 'Logging in…';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email:    document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('crm_token', data.token);
        window.location.href = '/crm/customers.html';
      } else {
        alertEl.textContent = data.message || 'Login failed';
        alertEl.className = 'alert alert-error';
      }
    } catch {
      alertEl.textContent = 'Network error.';
      alertEl.className = 'alert alert-error';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Login';
    }
  });
</script>
</body>
</html>
