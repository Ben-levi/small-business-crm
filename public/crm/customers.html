<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM — לקוחות</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://browser.sentry-cdn.com/8.44.0/bundle.min.js" crossorigin="anonymous"></script>
  <script>
    const _sentryDsn = '';
    if (_sentryDsn) Sentry.init({ dsn: _sentryDsn, tracesSampleRate: 0.2 });
  </script>
</head>
<body>

<a href="#main-content" class="skip-link">דלג לתוכן הראשי</a>

<nav aria-label="ניווט ראשי">
  <span class="logo">CRM העסק שלי</span>
  <ul>
    <li><a href="/" target="_blank">אתר הבית ↗</a></li>
    <li><a href="#" id="logoutBtn">יציאה</a></li>
  </ul>
</nav>

<div class="crm-layout">
  <aside class="sidebar" aria-label="ניווט CRM">
    <a href="/crm/customers.html" class="active" aria-current="page">לקוחות</a>
    <a href="/crm/orders.html">הזמנות</a>
  </aside>

  <main class="crm-main" id="main-content" tabindex="-1">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
      <h2 style="font-size:1.5rem;">לקוחות</h2>
      <div style="display:flex;gap:0.5rem;">
        <button class="btn btn-outline btn-sm" id="downloadBtn" title="הורד כ-CSV">📥 הורד</button>
        <button class="btn btn-primary btn-sm" id="addBtn">+ הוסף לקוח</button>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="חיפוש לפי שם או אימייל..." aria-label="חיפוש לקוחות" />
    </div>

    <div id="alert" class="alert hidden" role="alert" aria-live="polite"></div>

    <div class="card">
      <div class="table-wrap">
        <table aria-label="רשימת לקוחות">
          <thead>
            <tr>
              <th scope="col">שם</th>
              <th scope="col">אימייל</th>
              <th scope="col">טלפון</th>
              <th scope="col">כתובת</th>
              <th scope="col">תאריך הצטרפות</th>
              <th scope="col"><span class="visually-hidden">פעולות</span></th>
            </tr>
          </thead>
          <tbody id="customersTbody">
            <tr><td colspan="6" style="text-align:center;color:var(--muted)">טוען...</td></tr>
          </tbody>
        </table>
      </div>
      <nav class="pagination" aria-label="עימוד לקוחות">
        <span id="pageInfo" aria-live="polite"></span>
        <button id="prevBtn" disabled aria-label="עמוד קודם">קודם →</button>
        <button id="nextBtn" disabled aria-label="עמוד הבא">← הבא</button>
      </nav>
    </div>
  </main>
</div>

<!-- מודל הוספה/עריכה -->
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;">
  <div class="card" style="width:100%;max-width:480px;margin:1rem;">
    <h3 id="modalTitle" style="margin-bottom:1rem;">הוסף לקוח</h3>
    <form id="customerForm">
      <input type="hidden" id="customerId" />
      <div class="form-row">
        <div class="form-group">
          <label for="cName">שם *</label>
          <input type="text" id="cName" required aria-required="true" />
        </div>
        <div class="form-group">
          <label for="cEmail">אימייל</label>
          <input type="email" id="cEmail" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="cPhone">טלפון</label>
          <input type="text" id="cPhone" />
        </div>
        <div class="form-group">
          <label for="cAddress">כתובת</label>
          <input type="text" id="cAddress" />
        </div>
      </div>
      <div class="form-group">
        <label for="cNotes">הערות</label>
        <textarea id="cNotes"></textarea>
      </div>
      <div style="display:flex;gap:.75rem;justify-content:flex-end;">
        <button type="button" class="btn btn-outline" id="cancelBtn">ביטול</button>
        <button type="submit" class="btn btn-primary">שמור</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { requireAuth, apiFetch, logout } from '/js/crm/auth.js';
  requireAuth();

  document.getElementById('logoutBtn').addEventListener('click', (e) => { e.preventDefault(); logout(); });

  const tbody   = document.getElementById('customersTbody');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageInfo = document.getElementById('pageInfo');
  const alertEl  = document.getElementById('alert');
  const modal    = document.getElementById('modal');
  const form     = document.getElementById('customerForm');


  let page = 1;
  const LIMIT = 15;
  let searchTimer;

  async function loadCustomers() {
    const search = document.getElementById('searchInput').value;
    const res  = await apiFetch(`/api/customers?search=${encodeURIComponent(search)}&page=${page}&limit=${LIMIT}`);
    const data = await res.json();

    tbody.innerHTML = data.customers.length === 0
      ? `<tr><td colspan="6" style="text-align:center;color:var(--muted)">לא נמצאו לקוחות.</td></tr>`
      : data.customers.map(c => `
          <tr>
            <td><a href="/crm/customer-detail.html?id=${c.id}">${esc(c.name)}</a></td>
            <td>${esc(c.email || '—')}</td>
            <td>${esc(c.phone || '—')}</td>
            <td>${esc(c.address || '—')}</td>
            <td>${new Date(c.created_at).toLocaleDateString('he-IL')}</td>
            <td style="white-space:nowrap;">
              <button class="btn btn-outline btn-sm" onclick="editCustomer(${c.id})" aria-label="ערוך ${esc(c.name)}">ערוך</button>
              <button class="btn btn-danger btn-sm" onclick="deleteCustomer(${c.id})" aria-label="מחק ${esc(c.name)}">מחק</button>
            </td>
          </tr>`).join('');

    const total = data.total;
    pageInfo.textContent = `${Math.min((page-1)*LIMIT+1, total)}–${Math.min(page*LIMIT, total)} מתוך ${total}`;
    prevBtn.disabled = page === 1;
    nextBtn.disabled = page * LIMIT >= total;
    prevBtn.setAttribute('aria-disabled', prevBtn.disabled);
    nextBtn.setAttribute('aria-disabled', nextBtn.disabled);
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('searchInput').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { page = 1; loadCustomers(); }, 300);
  });

  prevBtn.addEventListener('click', () => { page--; loadCustomers(); });
  nextBtn.addEventListener('click', () => { page++; loadCustomers(); });

  let _returnFocus = null;

  function openModal(opener) {
    _returnFocus = opener || document.activeElement;
    modal.style.display = 'flex';
    setTimeout(() => document.getElementById('cName').focus(), 50);
  }

  function closeModal() {
    modal.style.display = 'none';
    if (_returnFocus) _returnFocus.focus();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.style.display === 'flex') closeModal();
  });

  document.getElementById('addBtn').addEventListener('click', (e) => {
    document.getElementById('modalTitle').textContent = 'הוסף לקוח';
    form.reset();
    document.getElementById('customerId').value = '';
    openModal(e.currentTarget);
  });
  document.getElementById('cancelBtn').addEventListener('click', closeModal);

  document.getElementById('downloadBtn').addEventListener('click', async () => {
    try {
      const res = await apiFetch('/api/export/customers');
      if (res.ok) {
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'customers.csv';
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
      }
    } catch (err) {
      alertEl.textContent = 'שגיאה בהורדה: ' + err.message;
      alertEl.className = 'alert alert-error';
    }
  });

  window.editCustomer = async (id) => {
    const res  = await apiFetch(`/api/customers/${id}`);
    const data = await res.json();
    document.getElementById('modalTitle').textContent = 'ערוך לקוח';
    document.getElementById('customerId').value = id;
    document.getElementById('cName').value    = data.name    || '';
    document.getElementById('cEmail').value   = data.email   || '';
    document.getElementById('cPhone').value   = data.phone   || '';
    document.getElementById('cAddress').value = data.address || '';
    document.getElementById('cNotes').value   = data.notes   || '';
    openModal(document.querySelector(`[aria-label="ערוך ${esc(data.name)}"]`));
  };

  window.deleteCustomer = async (id) => {
    if (!confirm('למחוק את הלקוח וכל ההזמנות שלו?')) return;
    await apiFetch(`/api/customers/${id}`, { method: 'DELETE' });
    loadCustomers();
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('customerId').value;
    const body = {
      name:    document.getElementById('cName').value,
      email:   document.getElementById('cEmail').value,
      phone:   document.getElementById('cPhone').value,
      address: document.getElementById('cAddress').value,
      notes:   document.getElementById('cNotes').value,
    };
    const method = id ? 'PUT' : 'POST';
    const url    = id ? `/api/customers/${id}` : '/api/customers';
    const res    = await apiFetch(url, { method, body: JSON.stringify(body) });
    if (res.ok) {
      closeModal();
      loadCustomers();
    } else {
      const data = await res.json();
      alertEl.textContent = data.message;
      alertEl.className = 'alert alert-error';
    }
  });

  loadCustomers();
</script>
</body>
</html>
